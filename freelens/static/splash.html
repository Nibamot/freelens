<html>
  <head>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1e2124;
      color: #6c757d;
      font-family: Arial, Helvetica, sans-serif;
    }
    .aligner-center-center {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aligner-content {
      position: relative;
      width: 100%;
      padding: 80px;
    }
    .icon {
      position: relative;
      font-size: 36px;
      line-height: 54px;
      margin-bottom: 10px;
      text-align: center;
    }
    .icon svg {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 54px;
      top: 14px;
    }
    .icon .icon-text {
      color: #fff;
      text-align: center;
      display: inline;
    }
    svg {
      position: relative;
      width: 100%;
    }
    .loading {
      padding-top: 10px;
      position: relative;
    }
    .bar {
      position: relative;
      height: 2px;
      background: #262b2f;
    }
    .progress {
      position: relative;
      height: 2px;
      background: #00a7a0;
      box-shadow: 0 0 20px #00a7a0;
      animation-name: loader-animation;
      animation-duration: 1.6s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes loader-animation {
      0% {
        left: 0;
        width: 0px;
      }
      50% {
        left: 0;
        width: 100%;
      }
      100% {
        left: 100%;
        width: 0px;
      }
    }
    .glow-wrapper {
      position: relative;
      width: 100%;
      height: 2px;
      top: -2px;
    }

    .glow {
      height: 100%;
      display: flex;
      transform: translateZ(0);
    }

    .glow div {
      flex: 1;
      background: #00a7a0;
      animation: glow 0.8s infinite alternate ease;
      box-shadow: 0 0 20px #00a7a0;
    }

    .glow div.b1 {
      animation-delay: -0.72s;
    }
    .glow div.b2 {
      animation-delay: -0.64s;
    }
    .glow div.b3 {
      animation-delay: -0.56s;
    }
    .glow div.b4 {
      animation-delay: -0.48s;
    }
    .glow div.b5 {
      animation-delay: -0.4s;
    }
    .glow div.b6 {
      animation-delay: -0.32s;
    }
    .glow div.b7 {
      animation-delay: -0.24s;
    }
    .glow div.b8 {
      animation-delay: -0.16s;
    }
    .glow div.b9 {
      animation-delay: -0.08s;
    }

    @keyframes glow {
      100% {
        background: transparent;
        flex: 10;
        box-shadow: 0 0 0 transparent;
      }
    }

    .text {
      height: 20px;
      line-height: 20px;
      text-align: center;
      margin-top: 5px;
    }
    </style>
  </head>
  <body>
    <div class="aligner-center-center">
      <div class="aligner-content">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
            <path
              d="M 364 200 A 164 164 0 1 0 36 200 A 164 164 0 1 0 364 200 Z M 324 200 A 124 124 0 1 0 76 200 A 124 124 0 1 0 324 200 Z"
              fill="#00a7a0"
              fill-rule="evenodd"
            />
            <path d="M 100,232 L 150,232 L 150,208 L 100,208 Z" fill="#00a7a0" />
            <path d="M 161.302,224.036 L 186.302,154.036 L 163.698,145.964 L 138.698,215.964 Z" fill="#00a7a0" />
            <path d="M 163.722,154.101 L 203.722,264.101 L 226.278,255.899 L 186.278,145.899 Z" fill="#00a7a0" />
            <path d="M 226.030,264.727 L 256.030,194.727 L 233.970,185.273 L 203.970,255.273 Z" fill="#00a7a0" />
            <path d="M 235.780,197.684 L 260.780,227.684 L 279.220,212.316 L 254.220,182.316 Z" fill="#00a7a0" />
            <path d="M 270,232 L 300,232 L 300,208 L 270,208 Z" fill="#00a7a0" />
            <circle cx="100" cy="220" r="12" fill="#00a7a0" />
            <circle cx="150" cy="220" r="12" fill="#00a7a0" />
            <circle cx="175" cy="150" r="12" fill="#00a7a0" />
            <circle cx="215" cy="260" r="12" fill="#00a7a0" />
            <circle cx="245" cy="190" r="12" fill="#00a7a0" />
            <circle cx="270" cy="220" r="12" fill="#00a7a0" />
            <circle cx="300" cy="220" r="12" fill="#00a7a0" />
          </svg>
          <div class="icon-text">IMS-Scope</div>
        </div>
        <div class="loading">
          <div class="bar">
            <div class="progress"></div>
          </div>
          <div class="glow-wrapper">
            <div class="glow">
              <div class="b1"></div>
              <div class="b2"></div>
              <div class="b3"></div>
              <div class="b4"></div>
              <div class="b5"></div>
              <div class="b6"></div>
              <div class="b7"></div>
              <div class="b8"></div>
              <div class="b9"></div>
            </div>
          </div>
          <div class="text">Loading...</div>
        </div>
      </div>
    </div>
  </body>
</html>
